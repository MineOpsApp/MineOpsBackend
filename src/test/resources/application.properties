spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

mineops.jwt.secret=test-secret-key-for-context-load-test-only-not-used-in-production
mineops.cors.allowed-origins=http://localhost:3000
mineops.audit-service.url=http://localhost:9090
mineops.internal-api-key=test-internal-key
mineops.market.api-key=test-market-key

# Email disabled for tests — no real SMTP creds available in CI/test context.
# spring.mail.host must still be set or Spring Boot won't create a JavaMailSender bean at all
# (EmailService requires one to be injected, even though mineops.mail.enabled=false means it's never used).
spring.mail.host=localhost
mineops.mail.enabled=false
mineops.mail.from-address=test@mineops.app
mineops.mail.from-name=MineOps Test
