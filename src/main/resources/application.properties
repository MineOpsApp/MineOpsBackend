spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mineops_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# No hardcoded fallback here on purpose — an unset password should fail startup loudly rather
# than silently connect (or fail to connect) using a known, in-repo value. Same reasoning as the
# JWT/internal-key secrets below.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Small app on a 1GB container — Spring's Hikari default (10 pooled connections) and Tomcat's
# default (200 threads) are massively oversized here, and each pooled connection to Neon carries
# its own TLS session buffer in native memory. Trim both to fit the container's real headroom.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:4}

spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate
# Logging every query's full formatted SQL on every request adds real per-request overhead
# and floods logs under load. Default off; set JPA_SHOW_SQL=true locally if you need to debug.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Env var names match MineOpsAuditService's names for the same two shared secrets exactly
# (MINEOPS_JWT_SECRET / MINEOPS_INTERNAL_API_KEY) — both services must resolve these to the
# identical values for tokens minted here to validate there, and for the audit outbox relay to
# authenticate against the audit service. No hardcoded fallback: an unset value must fail startup
# loudly (JwtService/AuditOutboxRelay both already enforce a presence/length check), never fall
# back to a known, in-repo secret.
mineops.jwt.secret=${MINEOPS_JWT_SECRET}
mineops.internal-api-key=${MINEOPS_INTERNAL_API_KEY}
# Empty (not a real key) fallback — this previously defaulted to a live-looking key committed to
# source, which must be rotated at the provider (api-ninjas.com). Market pricing is a non-critical
# feature (each commodity fetch already fails gracefully per-request), so a missing key should not
# crash the whole app at startup the way the JWT/internal-key secrets above correctly do.
mineops.market.api-key=${MARKET_API_KEY:}

# No localhost default in production: if AUDIT_SERVICE_URL is unset on Railway, silently defaulting
# to http://localhost:8082 would mean the relay tries to reach itself, every attempt fails, every
# audit log entry eventually hits MAX_ATTEMPTS and is marked FAILED — a total, silent loss of the
# audit trail with no startup error to reveal why. Fail fast instead (see AuditOutboxRelay).
mineops.audit-service.url=${AUDIT_SERVICE_URL}
mineops.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081,http://localhost:8082,http://172.20.10.4:19006,http://172.20.10.4:8082}

# Railway (and most PaaS hosts) assign a dynamic port via the PORT env var — Spring must bind to it.
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=-1
spring.mvc.pathmatch.use-suffix-pattern=false
spring.task.scheduling.enabled=true
# Only applies to Spring Boot's fallback /error handler (e.g. errors before a controller is
# reached) — GlobalExceptionHandler now handles everything dispatched through MVC and always
# returns a generic message, but this fallback path should not leak internal details either.
server.error.include-message=never
server.error.include-binding-errors=never

# --- Email (Gmail API via OAuth2 — replaces direct SMTP, which Railway blocks below its Pro
# plan, and third-party relays (Brevo, Resend), which can't pass DKIM/SPF alignment for a domain
# they don't own and get silently soft-bounced by Gmail. This sends genuinely through the real
# mobilegroup96@gmail.com account via Google's HTTPS API — fully authenticated, no relay.) ---
# See Google Cloud Console OAuth setup notes for how to obtain these.
mineops.gmail.client-id=${GMAIL_CLIENT_ID:}
mineops.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
mineops.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
mineops.gmail.sender-email=${GMAIL_SENDER_EMAIL:mobilegroup96@gmail.com}
mineops.gmail.sender-name=MineOps

# Kill switch for local dev without Gmail API credentials on hand.
mineops.mail.enabled=${MAIL_ENABLED:true}

# --- Paystack (marketplace buyer payments) ---
# Empty fallback, not fail-fast: unlike JWT/internal-key above, no Paystack account exists yet at
# the time this was wired up. PaystackService logs a warning and any payment-initiating endpoint
# returns a clear 503 if these are unset, rather than crashing the whole app on startup — same
# reasoning as mineops.market.api-key. Get real values from https://dashboard.paystack.com/#/settings/developers
# once a Paystack account exists, then set as PAYSTACK_SECRET_KEY / PAYSTACK_PUBLIC_KEY env vars.
mineops.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
mineops.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
# Where Paystack's checkout page sends the buyer back after payment. Not currently used to detect
# completion (the app relies on the webhook + a manual "check status" pull instead — see
# MarketplacePaymentController) but Paystack requires some callback_url on every initialize call.
mineops.paystack.callback-url=${PAYSTACK_CALLBACK_URL:https://mineopsbackend-production.up.railway.app/api/webhooks/paystack/callback}
