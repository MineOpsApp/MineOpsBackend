spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mineops_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sakumi}

# Small app on a 1GB container — Spring's Hikari default (10 pooled connections) and Tomcat's
# default (200 threads) are massively oversized here, and each pooled connection to Neon carries
# its own TLS session buffer in native memory. Trim both to fit the container's real headroom.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:4}

spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate
# Logging every query's full formatted SQL on every request adds real per-request overhead
# and floods logs under load. Default off; set JPA_SHOW_SQL=true locally if you need to debug.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

mineops.jwt.secret=${JWT_SECRET:this-is-a-long-secret-key-for-jwt-at-least-32-chars}
mineops.internal-api-key=${INTERNAL_API_KEY:this-is-a-long-internal-api-key-32chars!}
mineops.market.api-key=${MARKET_API_KEY:mPXbABBmWlt4AzWJfk9cCIx4dOyeW8MDcPqfAcWB}

mineops.audit-service.url=${AUDIT_SERVICE_URL:http://localhost:8082}
mineops.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081,http://localhost:8082,http://172.20.10.4:19006,http://172.20.10.4:8082}

# Railway (and most PaaS hosts) assign a dynamic port via the PORT env var — Spring must bind to it.
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=-1
spring.mvc.pathmatch.use-suffix-pattern=false
spring.task.scheduling.enabled=true
server.error.include-message=always
server.error.include-binding-errors=always

# --- Email (Gmail SMTP direct — switched from Brevo because Brevo-relayed mail claiming to be
# from a personal @gmail.com address was being silently dropped by Gmail's spam filtering; sending
# directly through Gmail's own servers avoids that specific trust problem) ---
# spring.mail.username is the full Gmail address; spring.mail.password is a 16-char Google App
# Password (requires 2-Step Verification enabled on the account) — NOT the account's login password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:mobilegroup96@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ccbkqlwsnhftvket}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender identity shown to recipients + a kill switch for local dev without real credentials
mineops.mail.from-address=${MAIL_FROM_ADDRESS:mobilegroup96@gmail.com}
mineops.mail.from-name=MineOps
mineops.mail.enabled=${MAIL_ENABLED:true}
