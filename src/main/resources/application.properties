spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/mineops_db
spring.datasource.username=postgres
spring.datasource.password=${MINEOPS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

mineops.jwt.secret=${MINEOPS_JWT_SECRET}
mineops.audit-service.url=${MINEOPS_AUDIT_SERVICE_URL:http://localhost:8081}
mineops.internal-api-key=${MINEOPS_INTERNAL_API_KEY}
mineops.cors.allowed-origins=${MINEOPS_CORS_ORIGINS:http://localhost:19006,http://localhost:8081,http://localhost:8082}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
mineops.market.api-key=gD2O0etGCB826inn6u7IIBlNULrYm3mN7h4GZ9hB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=-1
spring.mvc.pathmatch.use-suffix-pattern=false
